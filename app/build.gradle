plugins { id 'com.android.application' }

android {
    namespace 'com.edylaser3d.nfcwriter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edylaser3d.nfcwriter'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
